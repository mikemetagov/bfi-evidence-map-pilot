# Checks the data, builds the site and publishes it to GitHub Pages on every
# push to main. This repository is public: only GSR-approved, public-safe files
# belong here. Restricted outputs and partner data stay in the private workspace.
name: Check data, build and publish site
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check data and build generated files
        run: python scripts/build.py
      - name: Build EPPI-Mapper map from the generated data
        run: python scripts/build_eppi_map.py
      - name: Build site
        run: zensical build --clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
